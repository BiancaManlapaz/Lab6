<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/bootstrap.min.css"/>
    <link rel="stylesheet" href="css/style.css"/>

    <script type="module" src="js/bootstrap.bundle.min.js"></script>

</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar md:navbar-expand bg-1">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"></a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body mb-2 md:mb-0">
                    <ul class="nav navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Community Board</a>
                    </li>
                    </ul>
                    <form class="hstack gap-2" role="search">
                    <input class="form-control" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn-solid btn-icon theme-secondary" type="submit">
                        <svg class="bi" width="16" height="16"><use href="#search" /></svg>
                    </button>
                    </form>
                </div>
            </dialog>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="container my-5">
        <h1>Contact Me!</h1>

        <!-- CONTACT FORM -->
        <form>
            <div class="row g-4">

                <!-- FIRST NAME -->
                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="first-name" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="first-name" placeholder="Enter first name">
                    </div>
                </div>

                <!-- LAST NAME -->
                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="last-name" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="last-name" placeholder="Enter last name">
                    </div>
                </div>

                <!-- EMAIL -->
                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                    </div>
                </div>

                <!-- MESSAGE -->
                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message"></textarea>
                    </div>
                </div>

                <!-- FEEDBACK -->
                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="subject" class="form-label">What is your inquiry about?</label>
                        <select class="form-control" id="subject">
                            <option value="">Choose an option</option>
                            <option value="feedback">Feedback</option>
                            <option value="question">General Question</option>
                            <option value="collaboration">Collaboration</option>
                        </select>
                    </div>
                </div>

                <!-- QUESTIONS -->
                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="questions" class="form-label">Questions</label>
                        <input type="text" class="form-control" id="questions">
                    </div>
                </div>

                <!-- CONSENT CHECKBOX -->
                <div class="col-12">
                    <div class="form-field">
                        <input type="checkbox" id="checkLabel" class="check" />
                        <label for="checkLabel">I agree to be contacted regarding my inquiry.</label>
                    </div>
                </div>

                <!-- SUBMIT BUTTON -->
                <div class="col-12">
                    <button type="submit" class="btn-solid theme-primary">
                        Submit Message
                    </button>
                </div>
            </div>
        </form>
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-4">
        <p>2026 My Creative Portfolio. All rights reserved.</p>
    </footer>

</body>
</html>
